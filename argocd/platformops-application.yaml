apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platformops
  namespace: argocd
spec:
  project: default
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: platformops
      namespace: platformops
      jsonPointers:
        - /spec/replicas

  source:
    repoURL: https://github.com/rajmohanb82/k8s-platform-gitops.git
    targetRevision: main
    path: helm/platformops
    helm:
      releaseName: platformops
      valueFiles:
        - values-gitops.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: platformops

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
