apiVersion: v1
kind: Service
metadata:
  name: {{ include "platformops.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "platformops.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      nodePort: {{ .Values.service.nodePort }}
      protocol: TCP
