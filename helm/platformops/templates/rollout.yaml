apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "platformops.fullname" . }}
  labels:
    {{- include "platformops.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "platformops.fullname" . }}
    scaleDown: progressively
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - pause: {}
        - setWeight: 50
        - pause: {}
        - setWeight: 100
